[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmem"
dynamic = ["version"]
description = "Personal Wiki Memory MCP Server"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastmcp>=0.1.0",
    "python-frontmatter>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
openmem = "openmem.main:main"

[tool.hatch.version]
path = "openmem/__init__.py"
